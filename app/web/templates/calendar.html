<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    {{ year }}.{{ "%02d"|format(month) }} — Memento
</title>


<style>

    /* =====================================================
       Base
    ====================================================== */

    * {
        box-sizing: border-box;
    }


    html {
        scroll-behavior: smooth;
        height: 100%;
    }


    body {
        margin: 0;
        min-height: 100vh;

        background: #f7f6f2;

        color: #3f423f;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Helvetica Neue",
            Arial,
            sans-serif;

        font-weight: 400;

        -webkit-font-smoothing: antialiased;
    }


    a {
        color: inherit;
        text-decoration: none;
    }


    /* =====================================================
       Header
    ====================================================== */

    .archive-header {
        height: 76px;

        padding:
            0 6vw;

        display: flex;

        align-items: center;

        justify-content: space-between;

        border-bottom:
            1px solid #dfded8;

        flex-shrink: 0;
    }


    .archive-logo {
        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size: 24px;

        line-height: 1;

        letter-spacing: -0.04em;

        color: #3f423f;
    }


    .archive-nav {
        display: flex;

        align-items: center;

        gap: 28px;

        font-size: 11px;

        color: #9a9b96;
    }


    .archive-nav a {
        transition:
            color 0.2s ease;
    }


    .archive-nav a:hover {
        color: #3f423f;
    }


    .archive-nav a.active {
        color: #3f423f;
    }


    /* =====================================================
       Main

       The main area now uses the available viewport
       height instead of a fixed large bottom padding.
    ====================================================== */

    .archive-main {
        width: 100%;

        max-width: 1180px;

        margin: 0 auto;

        padding:
            48px 40px 34px;
    }


    /* =====================================================
       Heading
    ====================================================== */

    .archive-heading {
        margin-bottom: 28px;
    }


    .archive-title-row {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 30px;
    }


    .archive-title {
        margin: 0;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(48px, 7vw, 76px);

        line-height: 1;

        font-weight: 400;

        letter-spacing: -0.055em;

        color: #3f423f;
    }


    /* =====================================================
       Month navigation
    ====================================================== */

    .month-navigation {
        display: flex;

        align-items: center;

        gap: 8px;
    }


    .month-arrow {
        width: 38px;

        height: 38px;

        display: flex;

        align-items: center;

        justify-content: center;

        border:
            1px solid #dfded8;

        color: #9a9b96;

        font-size: 15px;

        line-height: 1;

        transition:
            color 0.2s ease,
            background 0.2s ease,
            border-color 0.2s ease;
    }


    .month-arrow:hover {
        color: #3f423f;

        background: #fbfaf7;

        border-color: #c9c8c1;
    }


    /* =====================================================
       Calendar
    ====================================================== */

    .calendar-wrapper {
        width: 100%;

        border-top:
            1px solid #dfded8;

        border-left:
            1px solid #dfded8;
    }


    /* =====================================================
       Weekdays
    ====================================================== */

    .calendar-weekdays {
        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(7, minmax(0, 1fr));
    }


    .calendar-weekday {
        min-width: 0;

        height: 38px;

        padding:
            11px 14px;

        border-right:
            1px solid #dfded8;

        border-bottom:
            1px solid #dfded8;

        font-size: 8px;

        line-height: 1;

        letter-spacing: 0.16em;

        color: #9a9b96;
    }


    /* =====================================================
       Calendar grid

       KEY CHANGE:
       Instead of fixed 150px rows, the rows use a
       viewport-based height.

       This allows the whole month to fit inside the
       available screen height on desktop.
    ====================================================== */

    #calendar-grid {

        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(7, minmax(0, 1fr));

        /*
         * Most calendars require 5 or 6 rows.
         *
         * 6 rows are given a height based on viewport.
         * minmax() prevents the cells from becoming
         * ridiculously small.
         */

        grid-auto-rows:
            minmax(
                90px,
                calc(
                    (100vh - 330px) / 6
                )
            );
    }


    /* =====================================================
       Every calendar cell
    ====================================================== */

    .memento-calendar-cell {

        position: relative;

        display: block;

        min-width: 0;

        min-height: 0;

        padding:
            13px;

        overflow: hidden;

        border-right:
            1px solid #dfded8;

        border-bottom:
            1px solid #dfded8;

        background: #f7f6f2;

        color: #3f423f;

        transition:
            background 0.2s ease;
    }


    .memento-calendar-cell:hover {

        background: #fbfaf7;
    }


    /* =====================================================
       Empty cells
    ====================================================== */

    .memento-calendar-empty {

        background: #f7f6f2;

        cursor: default;

        pointer-events: none;
    }


    /* =====================================================
       Day number
    ====================================================== */

    .memento-day-number {

        display: block;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size: 14px;

        line-height: 1;

        color: #9a9b96;
    }


    /* =====================================================
       Today
    ====================================================== */

    .memento-calendar-cell.is-today {

        background: #eeece6;
    }


    .memento-calendar-cell.is-today:hover {

        background: #e9e7e0;
    }


    .memento-calendar-cell.is-today
    .memento-day-number {

        color: #3f423f;

        font-weight: 500;
    }


    /* =====================================================
       Keyword
    ====================================================== */

    .memento-keyword {

        display: block;

        width: 100%;

        margin-top: 26px;

        padding-right: 4px;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size: 15px;

        line-height: 1.4;

        letter-spacing: -0.015em;

        color: #3f423f;

        overflow-wrap: anywhere;

        word-break: break-word;
    }


    /* =====================================================
       Footer
    ====================================================== */

    .archive-footer {

        padding:
            18px 6vw;

        border-top:
            1px solid #dfded8;

        display: flex;

        align-items: center;

        justify-content: space-between;

        font-size: 8px;

        letter-spacing: 0.03em;

        color: #9a9b96;

        flex-shrink: 0;
    }


    /* =====================================================
       Large / short desktop screens

       For laptops with shorter vertical screens,
       reduce vertical spacing further.
    ====================================================== */

    @media (max-height: 850px) and (min-width: 801px) {

        .archive-header {
            height: 68px;
        }


        .archive-main {
            padding:
                34px 40px 22px;
        }


        .archive-heading {
            margin-bottom: 22px;
        }


        .archive-title {
            font-size: 58px;
        }


        .calendar-weekday {
            height: 34px;
            padding: 9px 14px;
        }


        #calendar-grid {

            grid-auto-rows:
                minmax(
                    75px,
                    calc(
                        (100vh - 270px) / 6
                    )
                );
        }


        .memento-calendar-cell {
            padding: 11px;
        }


        .memento-keyword {
            margin-top: 20px;
            font-size: 14px;
        }


        .archive-footer {
            padding:
                14px 6vw;
        }

    }


    /* =====================================================
       Very short desktop screens
    ====================================================== */

    @media (max-height: 720px) and (min-width: 801px) {

        .archive-header {
            height: 60px;
        }


        .archive-logo {
            font-size: 22px;
        }


        .archive-main {
            padding:
                24px 34px 16px;
        }


        .archive-heading {
            margin-bottom: 16px;
        }


        .archive-title {
            font-size: 50px;
        }


        .month-arrow {
            width: 34px;
            height: 34px;
        }


        .calendar-weekday {
            height: 30px;
            padding: 8px 12px;
        }


        #calendar-grid {

            grid-auto-rows:
                minmax(
                    65px,
                    calc(
                        (100vh - 220px) / 6
                    )
                );
        }


        .memento-calendar-cell {
            padding: 9px;
        }


        .memento-day-number {
            font-size: 13px;
        }


        .memento-keyword {
            margin-top: 15px;
            font-size: 12px;
        }


        .archive-footer {
            padding:
                11px 6vw;
        }

    }


    /* =====================================================
       Tablet
    ====================================================== */

    @media (max-width: 800px) {

        .archive-header {

            padding:
                0 28px;
        }


        .archive-main {

            padding:
                48px 28px 70px;
        }


        #calendar-grid {

            grid-auto-rows:
                125px;
        }


        .memento-calendar-cell {

            padding:
                12px;
        }


        .memento-keyword {

            margin-top: 27px;

            font-size: 14px;
        }

    }


    /* =====================================================
       Mobile

       Mobile keeps the original scrolling behavior.
       The one-screen requirement is applied primarily
       to desktop where a 7-column calendar has enough
       horizontal room.
    ====================================================== */

    @media (max-width: 600px) {

        .archive-header {

            height: 68px;

            padding:
                0 20px;
        }


        .archive-logo {

            font-size: 22px;
        }


        .archive-nav {

            gap: 18px;

            font-size: 10px;
        }


        .archive-main {

            padding:
                52px 14px 75px;
        }


        .archive-heading {

            margin-bottom:
                32px;
        }


        .archive-title {

            font-size:
                44px;
        }


        .month-navigation {

            gap: 5px;
        }


        .month-arrow {

            width: 32px;

            height: 32px;
        }


        .calendar-weekday {

            height: 32px;

            padding:
                10px 4px;

            font-size: 7px;

            text-align: center;
        }


        #calendar-grid {

            grid-auto-rows:
                100px;
        }


        .memento-calendar-cell {

            padding:
                9px;
        }


        .memento-day-number {

            font-size: 12px;
        }


        .memento-keyword {

            margin-top:
                20px;

            font-size:
                11px;

            line-height:
                1.35;
        }


        .archive-footer {

            padding:
                22px 20px;
        }

    }


    /* =====================================================
       Very small screens
    ====================================================== */

    @media (max-width: 390px) {

        .archive-main {

            padding:
                45px 10px 65px;
        }


        .archive-title {

            font-size:
                40px;
        }


        #calendar-grid {

            grid-auto-rows:
                88px;
        }


        .memento-calendar-cell {

            padding:
                7px;
        }


        .memento-day-number {

            font-size:
                11px;
        }


        .memento-keyword {

            margin-top:
                16px;

            font-size:
                10px;
        }

    }

</style>

</head>

<body>

<header class="archive-header">

<a
    href="{{ url_for('index') }}"
    class="archive-logo"
>
    Memento
</a>


<nav class="archive-nav">

    <a
        href="{{ url_for('index') }}"
    >
        Today
    </a>


    <a
        href="{{ url_for(
            'calendar_view',
            year=year,
            month=month
        ) }}"
        class="active"
    >
        Archive
    </a>

</nav>

</header>

<main class="archive-main">

<section class="archive-heading">

    <div class="archive-title-row">

        <h1 class="archive-title">

            {{ year }}.{{ "%02d"|format(month) }}

        </h1>


        <div class="month-navigation">

            <a
                href="{{ url_for(
                    'calendar_view',
                    year=previous_year,
                    month=previous_month
                ) }}"
                class="month-arrow"
                aria-label="Previous month"
            >
                ←
            </a>


            <a
                href="{{ url_for(
                    'calendar_view',
                    year=next_year,
                    month=next_month
                ) }}"
                class="month-arrow"
                aria-label="Next month"
            >
                →
            </a>

        </div>

    </div>

</section>



<section class="calendar-wrapper">


    <div class="calendar-weekdays">

        <div class="calendar-weekday">
            MON
        </div>

        <div class="calendar-weekday">
            TUE
        </div>

        <div class="calendar-weekday">
            WED
        </div>

        <div class="calendar-weekday">
            THU
        </div>

        <div class="calendar-weekday">
            FRI
        </div>

        <div class="calendar-weekday">
            SAT
        </div>

        <div class="calendar-weekday">
            SUN
        </div>

    </div>


    <div id="calendar-grid"></div>


</section>

</main>

<footer class="archive-footer">

<span>
    Memento
</span>


<span>
    {{ year }}.{{ "%02d"|format(month) }}
</span>

</footer>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const year =
            {{ year }};


        const month =
            {{ month }};


        const today =
            "{{ today }}";


        const grid =
            document.getElementById(
                "calendar-grid"
            );


        const keywordData = {

            {% for item in keywords %}

            "{{ item.journal_date }}":
                {{ item.final_keyword|tojson }},

            {% endfor %}

        };


        const daysInMonth =
            new Date(
                year,
                month,
                0
            ).getDate();


        const firstDate =
            new Date(
                year,
                month - 1,
                1
            );


        let firstWeekday =
            firstDate.getDay();


        firstWeekday =
            (firstWeekday + 6) % 7;


        for (
            let i = 0;
            i < firstWeekday;
            i++
        ) {

            const emptyCell =
                document.createElement(
                    "div"
                );


            emptyCell.className =
                "memento-calendar-cell " +
                "memento-calendar-empty";


            grid.appendChild(
                emptyCell
            );

        }


        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {


            const paddedMonth =
                String(month)
                    .padStart(2, "0");


            const paddedDay =
                String(day)
                    .padStart(2, "0");


            const journalDate =
                year +
                "-" +
                paddedMonth +
                "-" +
                paddedDay;


            const cell =
                document.createElement(
                    "a"
                );


            cell.href =
                "/day/" +
                journalDate;


            cell.className =
                "memento-calendar-cell";


            cell.dataset.date =
                journalDate;


            if (
                journalDate === today
            ) {

                cell.classList.add(
                    "is-today"
                );

            }


            const dayNumber =
                document.createElement(
                    "span"
                );


            dayNumber.className =
                "memento-day-number";


            dayNumber.textContent =
                day;


            cell.appendChild(
                dayNumber
            );


            const keyword =
                keywordData[
                    journalDate
                ];


            if (
                keyword &&
                String(keyword).trim()
            ) {

                const keywordElement =
                    document.createElement(
                        "span"
                    );


                keywordElement.className =
                    "memento-keyword";


                keywordElement.textContent =
                    keyword;


                cell.appendChild(
                    keywordElement
                );

            }


            grid.appendChild(
                cell
            );

        }

    }

);

</script>

</body>

</html>
